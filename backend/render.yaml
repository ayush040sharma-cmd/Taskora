services:
  - type: web
    name: kanflow-api
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false   # set manually in Render dashboard
      - key: JWT_SECRET
        sync: false   # set manually in Render dashboard
      - key: FRONTEND_URL
        sync: false   # production: https://taskora.io
      - key: BACKEND_URL
        sync: false   # this service's own public URL — Render URL, or https://api.taskora.io if configured
      - key: RESEND_API_KEY
        sync: false   # from resend.com — required to actually send email
      - key: FROM_EMAIL
        sync: false   # e.g. "Taskora <support@taskora.io>"
      - key: EMAIL_REPLY_TO
        sync: false   # e.g. support@taskora.io
